    <style>
      .slider-admin {
        max-width: 1180px;
        margin: auto;
      }
      .banner-form,
      .banner-card {
        background: var(--admin-card);
        border: 1px solid var(--admin-border);
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .banner-form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .banner-form h2 {
        grid-column: 1/-1;
        margin: 0 0 5px;
        color: var(--admin-text);
      }
      .banner-form label {
        font-size: 13px;
        font-weight: 700;
        color: var(--admin-text);
      }
      .banner-form input,
      .banner-form textarea {
        display: block;
        width: 100%;
        margin-top: 7px;
        padding: 11px;
        border: 1px solid var(--admin-border);
        border-radius: 10px;
        background: var(--admin-card);
        color: var(--admin-text);
        font: inherit;
      }
      .banner-form textarea {
        resize: vertical;
      }
      .banner-form .full {
        grid-column: 1/-1;
      }
      .image-picker {
        border: 2px dashed var(--admin-gold);
        border-radius: 14px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
      }
      .image-picker img {
        max-width: 100%;
        height: 220px;
        object-fit: contain;
        border-radius: 10px;
        display: block;
        margin: 0 auto 10px;
        background: var(--admin-bg);
      }
      .banner-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        grid-column: 1/-1;
      }
      .banner-actions button {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .save-banner {
        background: var(--admin-gold);
        color: #fff;
      }
      .cancel-banner {
        background: var(--admin-bg);
        color: var(--admin-text);
      }
      .banner-list {
        display: grid;
        gap: 14px;
      }
      .banner-card {
        display: grid;
        grid-template-columns: 240px 1fr auto;
        gap: 16px;
        align-items: center;
      }
      .banner-card img {
        width: 240px;
        height: 145px;
        object-fit: contain;
        border-radius: 12px;
        background: var(--admin-bg);
      }
      .banner-card h3 {
        margin: 0 0 5px;
        color: var(--admin-text);
      }
      .banner-card p {
        margin: 0;
        color: var(--admin-muted);
        font-size: 13px;
      }
      .banner-card-actions {
        display: flex;
        gap: 6px;
        flex-direction: column;
      }
      .banner-card-actions button {
        border: 1px solid var(--admin-border);
        border-radius: 9px;
        background: transparent;
        color: var(--admin-text);
        padding: 8px 12px;
        cursor: pointer;
        font: inherit;
      }
      .banner-card-actions .danger {
        color: var(--admin-danger);
      }
      .banner-status {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--admin-success-bg);
        color: var(--admin-success);
        font-size: 11px;
        font-weight: 800;
      }
      .banner-status.off {
        background: rgba(217, 45, 32, 0.12);
        color: var(--admin-danger);
      }
      @media (max-width: 700px) {
        .banner-form {
          grid-template-columns: 1fr;
        }
        .banner-form .full {
          grid-column: auto;
        }
        .banner-card {
          grid-template-columns: 1fr;
        }
        .banner-card img {
          width: 100%;
          height: 210px;
        }
        .banner-card-actions {
          flex-direction: row;
          flex-wrap: wrap;
        }
      }
    </style>

          ><label

                src="../assets/images/hero-furniture.jpg"
                alt="معاينة"
              /><strong>اضغط لاختيار صورة الإعلان</strong

                id="bannerImage"
                type="file"
                accept="image/*"
